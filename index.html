<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>hs project</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7f4;
      --paper: #ffffff;
      --ink: #17211d;
      --muted: #5d6a64;
      --line: #d7ded9;
      --soft: #eaf0ec;
      --accent: #256b50;
      --accent-ink: #ffffff;
      --danger: #a23834;
      --shadow: 0 12px 36px rgba(31, 49, 40, .11);
      --r-sm: 8px;
      --r: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121815;
        --paper: #1b2420;
        --ink: #f1f5f2;
        --muted: #b4c0ba;
        --line: #36433d;
        --soft: #26322d;
        --accent: #6bc39a;
        --accent-ink: #102119;
        --danger: #f08b85;
        --shadow: 0 14px 38px rgba(0,0,0,.28);
      }
    }
    * { box-sizing: border-box; }
    html { min-width: 0; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", sans-serif; font-size: 16px; line-height: 1.45; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    .shell { max-width: 1180px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 34px) 64px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .student-switch { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; overflow: hidden; font-weight: 700; flex: 0 0 auto; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .student-select { border: 0; background: transparent; font-size: 1.14rem; font-weight: 700; max-width: 210px; padding: 5px 26px 5px 2px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn, .quiet-btn, .primary-btn, .danger-btn { min-height: 42px; border-radius: var(--r-sm); border: 1px solid var(--line); padding: 9px 13px; background: var(--paper); font-weight: 700; }
    .icon-btn { width: 42px; padding: 9px; display: grid; place-items: center; }
    .primary-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .danger-btn { color: var(--danger); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent); outline-offset: 2px; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 28px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); padding: 12px 13px 10px; font-weight: 700; }
    .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
    .page { display: none; }
    .page.active { display: block; }
    .page-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 22px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(1.75rem, 5vw, 3rem); line-height: 1.03; letter-spacing: -.035em; margin-bottom: 7px; }
    h2 { font-size: 1.28rem; margin-bottom: 12px; }
    h3 { font-size: 1.04rem; margin-bottom: 5px; }
    .muted { color: var(--muted); }
    .mono { font-family: "DM Mono", monospace; font-size: .84rem; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .span-8 { grid-column: span 8; }
    .span-4 { grid-column: span 4; }
    .span-12 { grid-column: 1 / -1; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(16px, 3vw, 24px); }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--line); background: var(--line); border-radius: var(--r); overflow: hidden; }
    .stat { background: var(--paper); padding: 17px; }
    .stat strong { display: block; font-family: "DM Mono", monospace; font-size: 1.45rem; }
    .section-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 12px; }
    .section-bar h2 { margin: 0; }
    .curriculum-list { display: grid; gap: 12px; }
    .course { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
    .course-head { width: 100%; border: 0; background: transparent; text-align: left; padding: 17px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
    .course-meta { display: flex; flex-wrap: wrap; gap: 7px 12px; color: var(--muted); font-size: .9rem; }
    .progress-track { height: 6px; background: var(--soft); border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .progress-track span { display: block; height: 100%; background: var(--accent); }
    .course-body { border-top: 1px solid var(--line); padding: 8px 17px 17px; }
    .chapter { border-bottom: 1px solid var(--line); padding: 13px 0; }
    .chapter:last-child { border-bottom: 0; }
    .chapter-name { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; }
    .lesson-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 7px; margin-top: 10px; }
    .check { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--bg); }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; color: var(--muted); text-align: center; }
    .schedule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .day-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
    .day-card textarea { min-height: 116px; }
    label { display: grid; gap: 6px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); padding: 10px 11px; }
    textarea { resize: vertical; min-height: 90px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .field-grid .full { grid-column: 1 / -1; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; }
    .toggle-row label { display: block; }
    .toggle { width: 46px; height: 26px; appearance: none; border: 0; border-radius: 20px; background: var(--line); padding: 3px; transition: background .15s; flex: 0 0 auto; }
    .toggle::before { content: ""; display: block; width: 20px; height: 20px; background: var(--paper); border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.22); }
    .toggle:checked { background: var(--accent); }
    .toggle:checked::before { transform: translateX(20px); }
    .calendar-toolbar { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px 13px; margin: 13px 0 20px; }
    .legend span { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .year-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .month { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 13px; }
    .month h3 { margin-bottom: 10px; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .weekdays span { text-align: center; font-family: "DM Mono", monospace; font-size: .66rem; color: var(--muted); }
    .day { aspect-ratio: 1; border: 0; border-radius: 5px; background: transparent; padding: 0; font-size: .76rem; position: relative; }
    .day:hover { background: var(--soft); }
    .day.has-mark { color: #14201a; font-weight: 700; }
    .day.has-mark::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: currentColor; right: 3px; bottom: 3px; opacity: .65; }
    .day.blank { pointer-events: none; }
    .record-list { display: grid; gap: 10px; }
    .record { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); padding: 11px 0; }
    .modal-wrap { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(9, 17, 13, .62); }
    .modal-wrap.open { display: flex; }
    .modal { width: min(740px, 100%); max-height: min(90vh, 850px); overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 30px); }
    .modal.wide { width: min(980px, 100%); }
    .modal-head { display: flex; justify-content: space-between; gap: 14px; align-items: start; margin-bottom: 20px; }
    .modal-head h2 { font-size: 1.55rem; margin-bottom: 3px; }
    .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
    .wizard-progress { display: flex; gap: 6px; margin-bottom: 26px; }
    .wizard-progress span { height: 5px; flex: 1; border-radius: 5px; background: var(--line); }
    .wizard-progress span.on { background: var(--accent); }
    .child-editor { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 11px; }
    .child-editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .catalog-filters { display: grid; grid-template-columns: 1fr 220px; gap: 10px; margin-bottom: 15px; }
    .publisher { margin-top: 22px; }
    .publisher h3 { border-bottom: 1px solid var(--line); padding-bottom: 7px; }
    .preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .preset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .preset button { min-height: 36px; }
    .subtabs { display: flex; gap: 8px; margin: 4px 0 18px; }
    .subtab { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 8px 13px; font-weight: 700; }
    .subtab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chapter-editor { border: 1px solid var(--line); border-radius: var(--r); padding: 13px; margin: 10px 0; }
    .tab-config-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; box-shadow: var(--shadow); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .notice { background: var(--soft); border-radius: var(--r-sm); padding: 11px 13px; color: var(--muted); }
    .source-note { margin-top: 30px; font-size: .8rem; color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 850px) {
      .span-8, .span-4 { grid-column: 1 / -1; }
      .year-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-head { align-items: start; flex-direction: column; }
    }
    @media (max-width: 590px) {
      .shell { padding-top: 14px; }
      .top-actions .text-label { display: none; }
      .tabs { margin-left: -14px; margin-right: -14px; padding: 0 10px; }
      .tab { padding-inline: 10px; }
      .stat-row { grid-template-columns: 1fr; }
      .field-grid, .catalog-filters, .preset-grid { grid-template-columns: 1fr; }
      .year-grid { grid-template-columns: 1fr; }
      .record { grid-template-columns: 1fr auto; }
      .record .date { grid-column: 1 / -1; }
      .calendar-toolbar { align-items: stretch; flex-direction: column; }
      .modal-wrap { padding: 0; align-items: end; }
      .modal { border-radius: 18px 18px 0 0; max-height: 94vh; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell" id="app" hidden>
    <div class="topline">
      <div class="student-switch">
        <div class="avatar" id="avatar"></div>
        <label class="sr-only" for="studentSelect">Child</label>
        <select id="studentSelect" class="student-select"></select>
      </div>
      <div class="top-actions">
        <button class="quiet-btn" id="tabsBtn"><span class="text-label">Tabs</span><span aria-hidden="true"> ≡</span></button>
        <button class="icon-btn" id="profileBtn" aria-label="Edit child profile" title="Edit child profile">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2V9.55h.4A1.7 1.7 0 0 0 4.1 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.56 3.2l.06.06A1.7 1.7 0 0 0 8.5 3.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4.05v.4A1.7 1.7 0 0 0 15.5 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.9 8c.36.6.97.97 1.67 1H22v4.05h-.4A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Tracker sections"></nav>
    <section class="page" id="page-current"></section>
    <section class="page" id="page-schedule"></section>
    <section class="page" id="page-planning"></section>
    <section class="page" id="page-records"></section>
    <section class="page" id="page-calendar"></section>
  </main>

  <div class="modal-wrap open" id="wizardWrap" role="dialog" aria-modal="true" aria-labelledby="wizardTitle">
    <div class="modal">
      <div class="wizard-progress"><span class="on"></span><span></span></div>
      <div id="wizardBody"></div>
    </div>
  </div>
  <div class="modal-wrap" id="genericWrap" role="dialog" aria-modal="true"><div class="modal wide" id="genericModal"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var COLORS = ["#256b50", "#2f64a3", "#a4512e", "#7a4d8f", "#9a6a14", "#376d73"];
  var TAB_NAMES = {current:"Current Year", schedule:"Schedule", planning:"Planning", records:"Records", calendar:"Calendar"};
  var LABELS = {
    school:{name:"School", color:"#73b98f"}, vacation:{name:"Vacation", color:"#e7bd62"}, field:{name:"Field trip", color:"#69a7cf"}, free:{name:"Free day", color:"#c9d1cc"}, sick:{name:"Sick day", color:"#df8b82"}, holiday:{name:"Holiday", color:"#d59ac6"}, coop:{name:"Co-op day", color:"#8e8ac8"}, half:{name:"Half day", color:"#a7cb72"}, testing:{name:"Testing", color:"#e09a5e"}, makeup:{name:"Makeup day", color:"#5bb9b1"}
  };
  var SINGAPORE = {
    PKA:["Match, Sort, and Classify","Compare Objects","Patterns","Numbers to 5 — Part 1","Numbers to 5 — Part 2","Numbers to 10 — Part 1","Numbers to 10 — Part 2"],
    PKB:["Ordinal Numbers","Shapes and Solids","Compare Sets","Compose and Decompose","Explore Addition and Subtraction","Cumulative Review"],
    KA:["Match, Sort, and Classify","Numbers to 5","Numbers to 10","Shapes and Solids","Compare Height, Length, Weight, and Capacity","Comparing Numbers Within 10"],
    KB:["Numbers to 20","Number Bonds","Addition","Subtraction","Addition and Subtraction","Numbers to 100","Time","Money"],
    "1A":["Numbers to 10","Number Bonds","Addition","Subtraction","Numbers to 20","Addition to 20","Subtraction Within 20","Shapes","Ordinal Numbers"],
    "1B":["Length","Comparing","Numbers to 40","Addition and Subtraction Within 40","Grouping and Sharing","Fractions","Numbers to 100","Addition and Subtraction Within 100","Time","Money"],
    "2A":["Numbers to 1,000","Addition and Subtraction — Part 1","Addition and Subtraction — Part 2","Length","Weight","Multiplication and Division","Multiplication and Division of 2, 5, and 10"],
    "2B":["Mental Calculation","Multiplication and Division of 3 and 4","Money","Fractions","Time","Capacity","Graphs","Shapes"],
    "3A":["Numbers to 10,000","Addition and Subtraction — Part 1","Addition and Subtraction — Part 2","Multiplication and Division","Multiplication","Division","Graphs and Tables"],
    "3B":["Multiplying and Dividing with 6, 7, 8, and 9","Fractions — Part 1","Fractions — Part 2","Measurement","Geometry","Area and Perimeter","Time","Money"],
    "4A":["Numbers to One Million","Addition and Subtraction","Multiples and Factors","Multiplication","Division","Fractions","Adding and Subtracting Fractions","Multiplying a Fraction and a Whole Number","Line Graphs and Line Plots"],
    "4B":["Measurement","Area and Perimeter","Decimals","Addition and Subtraction of Decimals","Multiplication and Division of Decimals","Angles","Lines and Shapes","Properties of Cuboids"],
    "5A":["Whole Numbers","Writing and Evaluating Expressions","Multiplication and Division","Addition and Subtraction of Fractions","Multiplication of Fractions","Division of Fractions","Measurement","Volume of Solid Figures"],
    "5B":["Decimals","The Four Operations of Decimals","Geometry","Data Analysis and Graphs","Ratio","Rate","Percentage"]
  };
  var PRESETS = [
    {p:"Logic of English", n:"Foundations A"},{p:"Logic of English", n:"Foundations B"},{p:"Logic of English", n:"Foundations C"},{p:"Logic of English", n:"Foundations D"},{p:"Logic of English", n:"Essentials"},
    {p:"All About Learning Press", n:"All About Reading Pre-Reading"},{p:"All About Learning Press", n:"All About Reading Level 1"},{p:"All About Learning Press", n:"All About Reading Level 2"},{p:"All About Learning Press", n:"All About Reading Level 3"},{p:"All About Learning Press", n:"All About Reading Level 4"},
    {p:"All About Learning Press", n:"All About Spelling Level 1"},{p:"All About Learning Press", n:"All About Spelling Level 2"},{p:"All About Learning Press", n:"All About Spelling Level 3"},{p:"All About Learning Press", n:"All About Spelling Level 4"},{p:"All About Learning Press", n:"All About Spelling Level 5"},{p:"All About Learning Press", n:"All About Spelling Level 6"},{p:"All About Learning Press", n:"All About Spelling Level 7"},
    {p:"The Good and the Beautiful", n:"Language Arts K"},{p:"The Good and the Beautiful", n:"Language Arts 1"},{p:"The Good and the Beautiful", n:"Language Arts 2"},{p:"The Good and the Beautiful", n:"Language Arts 3"},{p:"The Good and the Beautiful", n:"Language Arts 4"},{p:"The Good and the Beautiful", n:"Language Arts 5"},
    {p:"The Good and the Beautiful", n:"Math K"},{p:"The Good and the Beautiful", n:"Math 1"},{p:"The Good and the Beautiful", n:"Math 2"},{p:"The Good and the Beautiful", n:"Math 3"},{p:"The Good and the Beautiful", n:"Math 4"},{p:"The Good and the Beautiful", n:"Math 5"},{p:"The Good and the Beautiful", n:"Handwriting K"},{p:"The Good and the Beautiful", n:"Handwriting 1"},{p:"The Good and the Beautiful", n:"Handwriting 2"},{p:"The Good and the Beautiful", n:"Handwriting 3"},{p:"The Good and the Beautiful", n:"Handwriting 4"},{p:"The Good and the Beautiful", n:"Handwriting 5"},{p:"The Good and the Beautiful", n:"Handwriting 6"},{p:"The Good and the Beautiful", n:"Handwriting 7"}
  ].concat(Object.keys(SINGAPORE).map(function(level){ return {p:"Singapore Math", n:"Dimensions Math " + level, chapters:SINGAPORE[level]}; }));

  var state = null;
  var activeChild = 0;
  var activeTab = "current";
  var addTarget = "current";
  var wizardStep = 1;
  var draftChildren = [{name:"", birthday:"", color:COLORS[0], photo:"", attendance:true, startMonth:8}];
  var draftYear = {days:5, pattern:"public", weeks:38};

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]; }); }
  function uid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
  function monthName(i) { return new Intl.DateTimeFormat("en",{month:"long"}).format(new Date(2024,i,1)); }
  function toast(msg) { var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.timer); toast.timer=setTimeout(function(){t.classList.remove("show");},2200); }
  function currentChild() { return state.children[activeChild]; }
  function applyAccent() { var c=currentChild(); if(c) document.documentElement.style.setProperty("--accent", c.color); }
  function attendanceCount(child) { return Object.keys(child.calendar || {}).filter(function(k){ var v=child.calendar[k]; return ["school","field","coop","half","testing","makeup"].indexOf(v)>-1; }).length; }
  function completedLessons(course) { var n=0; (course.chapters||[]).forEach(function(ch){ (ch.lessons||[]).forEach(function(l){ if(l.done)n++; }); }); return n; }
  function totalLessons(course) { var n=0; (course.chapters||[]).forEach(function(ch){ n+=(ch.lessons||[]).length; }); return n; }

  function renderWizard() {
    var body=document.getElementById("wizardBody");
    document.querySelectorAll(".wizard-progress span").forEach(function(x,i){x.classList.toggle("on",i<wizardStep);});
    if(wizardStep===1) {
      body.innerHTML='<div class="modal-head"><div><h2 id="wizardTitle">Add children</h2><p class="muted">Set up each tracker.</p></div></div><div id="childDrafts"></div><button class="quiet-btn" id="addChildDraft">Add child</button><div class="modal-actions"><label class="quiet-btn" style="display:inline-flex;align-items:center;cursor:pointer">Import backup<input id="wizardImport" type="file" accept="application/json,.json" hidden></label><button class="primary-btn" id="wizardNext">Next</button></div>';
      renderDraftChildren();
      document.getElementById("addChildDraft").onclick=function(){ draftChildren.push({name:"",birthday:"",color:COLORS[draftChildren.length%COLORS.length],photo:"",attendance:true,startMonth:8}); renderDraftChildren(); };
      document.getElementById("wizardNext").onclick=function(){

  function openQuickLesson(course,ci,listName){openModal('<div class="modal-head"><div><h2>Add lesson</h2><p class="muted">'+esc(course.chapters[ci].name)+'</p></div><button class="icon-btn close-modal" aria-label="Close">×</button></div><label>Lesson name<input id="quickLesson"></label><div class="modal-actions"><button class="primary-btn" id="saveLesson">Add</button></div>');document.querySelector('.close-modal').onclick=closeModal;document.getElementById('saveLesson').onclick=function(){var n=document.getElementById('quickLesson').value.trim();if(!n)return;course.chapters[ci].lessons.push({name:n,done:false});closeModal();renderAll();}; }

  function openProfile(){var c=currentChild();openModal('<div class="modal-head"><div><h2>Child profile</h2></div><button class="icon-btn close-modal" aria-label="Close">×</button></div><div class="field-grid"><label>Name<input id="profileName" value="'+esc(c.name)+'"></label><label>Birthday<input id="profileBirthday" type="date" value="'+esc(c.birthday)+'"></label><label>Colour<select id="profileColor">'+COLORS.map(function(x){return '<option value="'+x+'" '+(x===c.color?'selected':'')+'>'+x.toUpperCase()+'</option>';}).join('')+'</select></label><label>Photo<input id="profilePhoto" type="file" accept="image/*"></label><div class="toggle-row full"><div><strong>Track attendance</strong></div><input class="toggle" id="profileAttendance" type="checkbox" '+(c.attendance?'checked':'')+'></div><label>Attendance year starts<select id="profileMonth">'+Array.from({length:12},function(_,m){return '<option value="'+m+'" '+(m===c.startMonth?'selected':'')+'>'+monthName(m)+'</option>';}).join('')+'</select></label><label>School days per week<select id="profileDays">'+[1,2,3,4,5,6,7].map(function(n){return '<option '+(state.year.days===n?'selected':'')+'>'+n+'</option>';}).join('')+'</select></label><label>Schedule type<select id="profilePattern"><option value="public">Public school</option><option value="round">Year-round</option><option value="custom">Custom</option></select></label><label>Weeks<input id="profileWeeks" type="number" min="1" max="53" value="'+state.year.weeks+'"></label></div><div class="modal-actions"><button class="primary-btn" id="saveProfile">Save</button></div>');document.querySelector('.close-modal').onclick=closeModal;document.getElementById('profilePattern').value=state.year.pattern;var photo=c.photo;document.getElementById('profilePhoto').onchange=function(e){var f=e.target.files[0];if(f){var r=new FileReader();r.onload=function(){photo=r.result;};r.readAsDataURL(f);}};document.getElementById('saveProfile').onclick=function(){var newDays=+document.getElementById('profileDays').value;c.name=document.getElementById('profileName').value.trim()||c.name;c.birthday=document.getElementById('profileBirthday').value;c.color=document.getElementById('profileColor').value;c.photo=photo;c.attendance=document.getElementById('profileAttendance').checked;c.startMonth=+document.getElementById('profileMonth').value;state.year.pattern=document.getElementById('profilePattern').value;state.year.weeks=Math.max(1,+document.getElementById('profileWeeks').value||1);if(newDays!==state.year.days){state.year.days=newDays;state.children.forEach(function(ch){while(ch.schedule.length<newDays)ch.schedule.push({name:'Day '+(ch.schedule.length+1),notes:''});ch.schedule=ch.schedule.slice(0,newDays);});}closeModal();renderAll();toast('Profile saved');};}
  function openTabs(){openModal('<div class="modal-head"><div><h2>Tabs</h2><p class="muted">Change order or visibility.</p></div><button class="icon-btn close-modal" aria-label="Close">×</button></div><div id="tabConfig">'+state.tabs.map(function(t,i){return '<div class="tab-config-row" data-i="'+i+'"><strong>'+TAB_NAMES[t.id]+'</strong><button class="icon-btn up" aria-label="Move '+TAB_NAMES[t.id]+' up">↑</button><button class="icon-btn down" aria-label="Move '+TAB_NAMES[t.id]+' down">↓</button><input class="toggle show-tab" type="checkbox" '+(t.show?'checked':'')+' aria-label="Show '+TAB_NAMES[t.id]+'"></div>';}).join('')+'</div><div class="modal-actions"><button class="primary-btn" id="saveTabs">Done</button></div>');document.querySelector('.close-modal').onclick=closeModal;function reOpen(){closeModal();openTabs();}document.querySelectorAll('.up').forEach(function(b){b.onclick=function(){var i=+b.closest('.tab-config-row').dataset.i;if(i>0){var x=state.tabs.splice(i,1)[0];state.tabs.splice(i-1,0,x);reOpen();}};});document.querySelectorAll('.down').forEach(function(b){b.onclick=function(){var i=+b.closest('.tab-config-row').dataset.i;if(i<state.tabs.length-1){var x=state.tabs.splice(i,1)[0];state.tabs.splice(i+1,0,x);reOpen();}};});document.getElementById('saveTabs').onclick=function(){document.querySelectorAll('.tab-config-row').forEach(function(row){state.tabs[+row.dataset.i].show=row.querySelector('.show-tab').checked;});if(!state.tabs.some(function(t){return t.show;})){toast('Keep at least one tab visible');return;}closeModal();renderAll();};}
  function exportBackup(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hs-project-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},500);toast('Backup downloaded');}
  function importBackup(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!data||!Array.isArray(data.children)||!data.children.length||!Array.isArray(data.tabs))throw new Error('bad');state=data;activeChild=0;activeTab=state.tabs.find(function(t){return t.show;}).id;document.getElementById('wizardWrap').classList.remove('open');document.getElementById('app').hidden=false;closeModal();renderAll();toast('Backup imported');}catch(err){toast('That backup file is not valid');}};r.readAsText(f);}

  document.getElementById('profileBtn').onclick=openProfile;
  document.getElementById('tabsBtn').onclick=openTabs;
  document.getElementById('genericWrap').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  renderWizard();
})();
</script>
</body>
